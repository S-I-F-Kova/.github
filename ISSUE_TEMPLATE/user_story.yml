name: User Story
description: Créer une nouvelle User Story transversale pour l'écosystème Kova
title: "[US] "
labels: ["user-story"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Contexte fonctionnel et valeur ajoutée de la fonctionnalité.
      placeholder: Décrivez brièvement le besoin et l'objectif de cette story...
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Énoncé de la Story"

  - type: input
    id: en-tant-que
    attributes:
      label: En tant que
      placeholder: "utilisateur de Kova / système / lampe passerelle..."
    validations:
      required: true

  - type: input
    id: je-veux
    attributes:
      label: Je veux
      placeholder: "pouvoir réaliser telle action..."
    validations:
      required: true

  - type: input
    id: afin-de
    attributes:
      label: Afin de
      placeholder: "obtenir tel bénéfice..."
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## 🏗️ Composantes impactées"

  - type: checkboxes
    id: composantes
    attributes:
      label: Composantes
      description: Sélectionnez les pôles techniques concernés par cette story.
      options:
        - label: Infrastructure (`infrastructure`)
        - label: Mobile (`Mobile main`)
        - label: Hardware (`Lamp`)

  - type: textarea
    id: user-flow
    attributes:
      label: 🔄 User Flow (Mermaid)
      description: Diagramme de flux optionnel pour illustrer les interactions.
      value: |
        flowchart TD
            A[Début] --> B[Étape 1]
      render: mermaid
    validations:
      required: false

  - type: markdown
    attributes:
      value: "## ✅ Critères d'Acceptation"

  - type: textarea
    id: happy-path
    attributes:
      label: "Scénario 1 : Succès (Happy Path)"
      value: |
        - **Étant donné que** 
        - **Quand** 
        - **Alors** 
        - **Et** 
    validations:
      required: true

  - type: textarea
    id: edge-case
    attributes:
      label: "Scénario 2 : Cas limite ou Erreur (Edge Case)"
      value: |
        - **Étant donné que** 
        - **Quand** 
        - **Alors** 
        - **Et** 
    validations:
      required: true
