name: Tâche Technique (Issue)
description: Créer une tâche technique d'implémentation liée à une User Story
title: "[TECH] "
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Résumé de la tâche technique à réaliser...
    validations:
      required: true

  - type: input
    id: user-story-liee
    attributes:
      label: User story liée
      description: Référence de la User Story mère (ex. org/kova-management#12).
      placeholder: "#12"
      value: S-I-F-Kova/kova-management#
    validations:
      required: true

  - type: textarea
    id: objectif-technique
    attributes:
      label: Objectif technique
      placeholder: Détaillez l'architecture, les endpoints ou les modifications attendues...
    validations:
      required: true

  - type: textarea
    id: taches-implementation
    attributes:
      label: Tâches d'implémentation
      placeholder: "Détaillez les implémentations à faire. Ex: * **Routes** - Ajout d'une route `/`"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Scénarios de Validation"

  - type: textarea
    id: scenario-nominal
    attributes:
      label: Scénario Nominal (Happy Path)
      value: |
        - **Étant donné que :** <état initial des données, authentification ou paramètres d'entrée>
        - **Quand :** <action déclenchée (ex: POST /endpoint, appel RPC, exécution d'un script)>
        - **Alors :** <résultat technique attendu (code HTTP 200/201, données persistées en base, message gRPC)>
    validations:
      required: true

  - type: textarea
    id: scenario-erreur
    attributes:
      label: Scénario Limite / Erreur
      value: |
        - **Étant donné que :** <condition invalide, token expiré ou champ manquant>
        - **Quand :** <la requête ou l'appel est transmis>
        - **Alors :** <l'erreur est interceptée proprement (ex: HTTP 400/401/403 ou code gRPC équivalent)>
        - **Et :** <un format d'erreur standard est retourné sans fuite de stack trace interne>
    validations:
      required: true
